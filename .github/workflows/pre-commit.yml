name: BanaOffice development checks

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Source and metadata checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project metadata and website only
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*
            /.github/
            /docs/
            /tests/site/
            /README.md
            /LICENSE
            /NOTICE
            /main/LICENSE
            /main/NOTICE
            /.pre-commit-config.yaml
            /requirements-dev.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pre-commit on checked-out project metadata
        run: pre-commit run --color=always --all-files

      - name: Run dependency-free website tests
        run: python -m unittest discover -s tests/site -v

      - name: Verify required project and license files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE main/LICENSE main/NOTICE; do
            test -s "$file" || { echo "::error::Required file missing or empty: $file"; exit 1; }
          done
          grep -q "Apache OpenOffice" README.md
          grep -q "BanaOffice" README.md
          grep -q "Apache License" LICENSE
